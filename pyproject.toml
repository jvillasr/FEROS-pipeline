[project]
name = "feros-pipeline"
version = "0.1.0"
description = "FEROS-specific CERES adaptation for MPIA reduction workflows."
readme = "README.md"
requires-python = ">=3.9,<3.10"
dependencies = [
    "astropy==4.3.1",
    "ephem==4.2",
    "matplotlib==3.5.3",
    "numpy==1.21.6",
    "pandas==1.3.5",
    "Pillow==9.5.0",
    "PyAstronomy==0.22.0",
    "pycurl==7.45.1",
    "scipy==1.7.3",
    "statsmodels==0.13.5",
]

[project.urls]
Repository = "https://github.com/jvillasr/FEROS-pipeline"
Upstream = "https://github.com/rabrahm/ceres"

[tool.uv]
package = false
